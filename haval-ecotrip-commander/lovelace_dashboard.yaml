      # BLOCO E — Personalizado (requer custom:apexcharts-card do HACS)
      # ════════════════════════════════════════════════════════════════════
      - type: conditional
        conditions:
          - condition: state
            entity: input_select.ecotrip_periodo
            state: "Personalizado"
        card:
          type: vertical-stack
          cards:
            - type: markdown
              content: >
                #### 📊 Gráfico por intervalo personalizado

                **Requer `custom:apexcharts-card`** instalado via HACS.

                Após instalar, substitua este card pelo YAML abaixo:

                ```yaml
                type: custom:apexcharts-card
                graph_span: >-
                  {{ [ ((as_timestamp(states('input_datetime.ecotrip_data_fim'))
                         - as_timestamp(states('input_datetime.ecotrip_data_inicio')))
                        / 3600) | round(0), 1 ] | max }}h
                span:
                  start: second
                  offset: >-
                    -{{ [ ((as_timestamp(now())
                            - as_timestamp(states('input_datetime.ecotrip_data_inicio')))
                           / 3600) | round(0), 0 ] | max }}h
                header:
                  show: true
                  title: "⚡ Consumo elétrico — período personalizado"
                  show_states: true
                series:
                  - entity: sensor.haval_ecotrip_trip_a_kwh_100km
                    name: Trip A kWh/100km
                    color: "#30D158"
                  - entity: sensor.haval_ecotrip_trip_b_kwh_100km
                    name: Trip B kWh/100km
                    color: "#0A84FF"
                  - entity: sensor.haval_ecotrip_rolling_kwh_100km
                    name: Rolling kWh/100km
                    color: "#FFD60A"
                ```

            - type: statistics-graph
              title: ⚡ Consumo elétrico (intervalo calculado)
              days_to_show: 30
              period: day
              stat_types:
                - mean
              entities:
                - entity: sensor.haval_ecotrip_trip_a_kwh_100km
                  name: Trip A kWh/100km
                - entity: sensor.haval_ecotrip_trip_b_kwh_100km
                  name: Trip B kWh/100km
                - entity: sensor.haval_ecotrip_rolling_kwh_100km
                  name: Rolling kWh/100km
            - type: statistics-graph
              title: ⛽ Rendimento combustível (intervalo calculado)
              days_to_show: 30
              period: day
              stat_types:
                - mean
              entities:
                - entity: sensor.haval_ecotrip_trip_a_km_l
                  name: Trip A km/L
                - entity: sensor.haval_ecotrip_trip_b_km_l
                  name: Trip B km/L
                - entity: sensor.haval_ecotrip_rolling_km_l
                  name: Rolling km/L

  ##########################################################################
  # VIEW 6 — CONTROLES
  ##########################################################################
  - title: Controles
    path: ecotrip-controles
    icon: mdi:tune

    cards:

      - type: markdown
        content: >
          ## ⚙️ Controles do Veículo

          Envia comandos MQTT para o app no carro, que repassa para o veículo.

      - type: entities
        title: Limite de Carga da Bateria
        show_header_toggle: false
        entities:
          - entity: select.haval_ecotrip_charge_limit
            name: Limite SOC (%)
            icon: mdi:battery-charging-80

      - type: markdown
        content: >
          **Tópico de comando:** `haval/ecotrip/cmd/charge_limit`

          **Valores aceitos:** 50, 60, 70, 80, 90, 100

          O app no carro converte para o valor que o veículo entende
          e confirma em `haval/ecotrip/cmd/charge_limit/result`.

      - type: logbook
        title: Log de comandos recentes
        hours_to_show: 24
        entities:
          - sensor.haval_ecotrip_trip_a_concluida
          - sensor.haval_ecotrip_trip_b_concluida
